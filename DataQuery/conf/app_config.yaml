logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:META_DB_HOST,127.0.0.1}
  port: ${oc.env:META_DB_PORT,3306}
  user: ${oc.env:META_DB_USER,data_agent}
  password: ${oc.env:META_DB_PASSWORD,change-me}
  database: ${oc.env:META_DB_NAME,meta}

db_dw:
  host: ${oc.env:DW_DB_HOST,127.0.0.1}
  port: ${oc.env:DW_DB_PORT,3306}
  user: ${oc.env:DW_DB_USER,data_agent}
  password: ${oc.env:DW_DB_PASSWORD,change-me}
  database: ${oc.env:DW_DB_NAME,dw}

qdrant:
  host: ${oc.env:QDRANT_HOST,127.0.0.1}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: ${oc.env:EMBEDDING_SIZE,1024}

embedding:
  host: ${oc.env:EMBEDDING_HOST,127.0.0.1}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: ${oc.env:EMBEDDING_MODEL,BAAI/bge-large-zh-v1.5}


es:
  host: ${oc.env:ELASTICSEARCH_HOST,127.0.0.1}
  port: ${oc.env:ELASTICSEARCH_PORT,9200}
  index_name: ${oc.env:ES_VALUE_INDEX,data-agent-column}


llm:
  model_name: ${oc.env:LLM_MODEL_NAME,deepseek-v4-pro}
  api_key: ${oc.env:LLM_API_KEY,change-me}
